name: Generate Thessla Green metadata

"on":
  push:
    branches:
      - thessla-green
    paths:
      - .github/workflows/thessla-verify.yml

concurrency:
  group: thessla-generate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Temporary: required to commit generated Home Assistant metadata.

jobs:
  generate:
    name: Generate metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install Core and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt -e . 'infrared-protocols==10.0.0' 'rf-protocols==4.3.0' 'paho-mqtt==2.1.0' 'aiohasupervisor==0.6.0' 'modbus-connection[tmodbus]==4.11.1' 'pymodbus==3.13.1' 'tmodbus==0.6.2' 'thessla-green-modbus==0.1.0a4'
      - name: Generate Home Assistant metadata
        run: |
          python -m script.hassfest
          python -m script.gen_requirements_all
      - name: Commit generated files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add CODEOWNERS \
            homeassistant/generated/config_flows.py \
            homeassistant/generated/integrations.json \
            requirements.txt \
            requirements_all.txt \
            requirements_test_pre_commit.txt \
            homeassistant/package_constraints.txt
          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate Thessla Green metadata"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
