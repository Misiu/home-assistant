name: Verify Thessla Green

on:
  push:
    branches: [thessla-green]
    paths:
      - homeassistant/components/thessla_green/**
      - tests/components/thessla_green/**
      - .github/workflows/thessla-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Core and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-cov ruff mypy
      - name: Hassfest
        run: python -m script.hassfest --integration-path homeassistant/components/thessla_green --requirements
      - name: Ruff
        run: |
          python -m ruff format --check homeassistant/components/thessla_green
          python -m ruff check homeassistant/components/thessla_green
      - name: Compile
        run: python -m compileall -q homeassistant/components/thessla_green
